<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Forest</title>
    <style>
      /* body[data-state]: loading (default), settling (running behind the loader), ready, error.
         .walked hides the hint after the first steps, .left the ring once the walker has left the start area. */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        /* the loader's painting's sky where its top fades out: a taller screen
           gets more of it, with no edge */
        background: #b09979;
        color: #fff3df;
        color-scheme: dark;
        font:
          700 14px/1.4 system-ui,
          sans-serif;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        opacity: 0;
        transition: opacity 1.5s;
      }
      [data-state='ready'] #scene {
        opacity: 1;
      }

      /* The loader: a painting of the forest (#art, loader.ts) revealed in steps as the load goes on, under the
         title, the track and the stage in the open sky, all in the woods' deep green with the painting's gold */
      #loader {
        position: fixed;
        inset: 0;
        color: #263220;
        transition:
          opacity 0.6s,
          visibility 0.6s;
      }
      [data-state='ready'] #loader {
        opacity: 0;
        visibility: hidden;
      }
      /* (the painting fills the width, its foot on the bottom edge: above it the page's own sky) */
      #art {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      /* One sprite sheet holds every picture of the loader (1472 x 2592): the painting's three layers at 720 x 1280,
         the light at 360 x 640, the logo at 480 x 413, each with 8 px of its own edge repeated round it, so a scaled
         cell never takes a neighbour's pixels. A cell is cut out by background-size (the sheet's width over the
         cell's) and background-position (the cell's place over the room the sheet leaves beside it) */
      #art i,
      #logo {
        background: url(/assets/loader/loader.webp) no-repeat;
      }
      #art i {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        aspect-ratio: 720 / 1280;
        background-size: 204.444% auto;
      }
      #art .shapes {
        background-position: 1.064% 0.61%;
      }
      #art .colour {
        background-position: 98.936% 0.61%;
      }
      #art .detail {
        background-position: 1.064% 99.39%;
      }
      #art .light {
        background-size: 408.889% auto;
        background-position: 66.906% 66.803%;
      }
      #art .colour,
      #art .detail,
      #art .light {
        opacity: 0;
      }
      /* (the logo, the track and the stage, centred about 34 percent down, in the sky) */
      #heading {
        position: absolute;
        top: 34%;
        left: 0;
        right: 0;
        translate: 0 -50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 0 24px;
        text-align: center;
      }
      /* (the logo, a cell of the sheet: its label is the title screen readers read; it shows once the sheet is
         decoded, main.ts, never half drawn; no wider than 300 px or 76 percent, and no taller than 30 percent, so a
         short screen's trees stay clear of it; a little more room under its leaf) */
      h1 {
        margin: 0 0 4px;
        line-height: 0;
      }
      #logo {
        display: block;
        width: min(300px, 76vw, 34.9vh);
        aspect-ratio: 480 / 413;
        background-size: 306.667% auto;
        background-position: 75% 89.95%;
        opacity: 0;
        transition: opacity 0.2s;
      }
      #logo.shown {
        opacity: 1;
      }
      #track {
        width: min(260px, 70%);
        height: 6px;
        overflow: hidden;
        border-radius: 6px;
        background: #26322038;
      }
      #bar {
        display: block;
        height: 100%;
        background: #a8763c;
        transform: scaleX(0);
        transform-origin: 0;
        will-change: transform;
      }
      #status {
        margin: 0;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      /* a problem: the message, then what is known about the run, selectable so it can be copied */
      [data-state='error'] #track {
        display: none;
      }
      [data-state='error'] #status {
        max-width: 340px;
        font-size: 16px;
        letter-spacing: 0;
        text-transform: none;
        user-select: text;
        -webkit-user-select: text;
      }
      #details {
        display: none;
        width: 100%;
        max-width: 360px;
        max-height: 45vh;
        margin: 0;
        padding: 10px 12px;
        overflow: auto;
        border-radius: 10px;
        background: #263220e0;
        color: #f3ead8;
        font:
          500 11px/1.5 ui-monospace,
          Menlo,
          monospace;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-word;
        user-select: text;
        -webkit-user-select: text;
      }
      [data-state='error'] #details {
        display: block;
      }

      #stats {
        position: fixed;
        top: 8px;
        left: 10px;
        right: 10px;
        margin: 0;
        font:
          600 11px/1.4 ui-monospace,
          Menlo,
          monospace;
        text-shadow: 0 1px 3px #000;
        pointer-events: none;
      }

      /* The only control: the bottom left corner, --walk-zone square, walks while held; a drag anywhere else looks
         around. A near white hairline ring with a chevron marks it: pressed, ring and chevron go nearly opaque;
         after the first steps it rests at 40 percent; once the walker has left the start area (main.ts) it fades
         away for good, and the corner still walks */
      :root {
        --walk-zone: 132px;
      }
      #walk {
        position: fixed;
        left: 0;
        bottom: 0;
        display: none;
        width: var(--walk-zone);
        height: var(--walk-zone);
        padding: 0;
        border: 0;
        background: none;
        color: #f4f1ead9;
        touch-action: none;
        transition: opacity 1s;
      }
      [data-state='ready'] #walk {
        display: block;
      }
      /* (the ring, 68.5 px about a point 54 px in and 56 up: a faint dark veil inside and a soft dark shadow
         outside, so it reads on fog and sky as on shade) */
      #walk::before {
        content: '';
        position: absolute;
        left: 19.75px;
        bottom: 21.75px;
        width: 68.5px;
        height: 68.5px;
        border: 1.575px solid currentColor;
        border-radius: 50%;
        background: #120a0526;
        box-shadow: 0 0 16px #120a0540;
        pointer-events: none;
        transition:
          border-color 0.15s,
          background-color 0.15s;
      }
      #walk svg {
        position: absolute;
        left: 42px;
        bottom: 44px;
        width: 24px;
        height: 24px;
        filter: drop-shadow(0 0 3px #120a0566);
        pointer-events: none;
      }
      .walked #walk {
        opacity: 0.4;
      }
      #walk.on {
        opacity: 1;
        color: #f4f1eaf2;
        transition-duration: 0.2s;
      }
      #walk.on::before {
        background-color: #120a051a;
      }
      .left #walk,
      .left #walk.on {
        opacity: 0;
        transition: opacity 4s;
      }

      /* two quiet lines level with the ring, centred in the room between its right edge (88.25 px in) and the
         screen's, 12 px clear of each; gone after the first steps; a soft dark halo keeps them legible. A narrow
         screen wraps the second line */
      #hint {
        position: fixed;
        left: calc(88.25px + 12px);
        right: 12px;
        bottom: 38px;
        text-align: center;
        display: none;
        margin: 0;
        color: #fff3df;
        font:
          400 12px/1.5 system-ui,
          sans-serif;
        text-shadow:
          0 0 6px #120a0599,
          0 0 16px #120a0599,
          0 0 32px #120a0566;
        pointer-events: none;
        transition: opacity 1s;
      }
      #hint span {
        display: block;
        opacity: 0.65;
        text-wrap: balance; /* (a wrapped line breaks into two even ones) */
      }
      #hint span:first-child {
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        opacity: 0.9;
      }
      [data-state='ready'] #hint {
        display: block;
      }
      .walked #hint {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="loader">
      <div id="art" aria-hidden="true">
        <i class="shapes"></i><i class="colour"></i><i class="detail"></i
        ><i class="light"></i>
      </div>
      <div id="heading">
        <h1><i id="logo" role="img" aria-label="Forest walk"></i></h1>
        <div id="track"><i id="bar"></i></div>
        <p id="status">Lacing boots…</p>
        <pre id="details"></pre>
      </div>
    </div>
    <p id="stats" hidden></p>
    <button id="walk" aria-label="Walk">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.575"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M3 15.5 12 6.5l9 9" />
      </svg>
    </button>
    <p id="hint">
      <span>Hold to walk</span><span>Drag anywhere to look around</span>
    </p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
