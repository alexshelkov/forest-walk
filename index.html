<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Forest</title>
    <style>
      /* body[data-state]: loading (default), settling (running behind the loader), ready, error.
         .walked hides the hint after the first steps. */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: radial-gradient(#4a2a10, #120a05 70%) #120a05;
        color: #fff3df;
        color-scheme: dark;
        font:
          700 14px/1.4 system-ui,
          sans-serif;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        opacity: 0;
        transition: opacity 1.5s;
      }
      [data-state='ready'] #scene {
        opacity: 1;
      }

      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 0 24px;
        text-align: center;
        transition:
          opacity 0.6s,
          visibility 0.6s;
      }
      [data-state='ready'] #loader {
        opacity: 0;
        visibility: hidden;
      }
      h1 {
        margin: 0;
        font:
          900 56px/1 system-ui,
          sans-serif;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: transparent;
        background: linear-gradient(#fff6dc 25%, #ffc24a 60%, #d9541e);
        -webkit-background-clip: text;
        background-clip: text;
      }
      #track {
        width: min(260px, 70%);
        height: 6px;
        overflow: hidden;
        border-radius: 6px;
        background: #120a05;
        box-shadow:
          0 0 0 2px #ffc24a80,
          0 0 18px #d9541e;
      }
      #bar {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #d9541e, #ffd98a);
        transform: scaleX(0);
        transform-origin: 0;
        will-change: transform;
      }
      #status {
        margin: 0;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      /* a problem: the message, then what is known about the run, selectable so it can be copied */
      [data-state='error'] #track {
        display: none;
      }
      [data-state='error'] #status {
        max-width: 340px;
        font-size: 16px;
        letter-spacing: 0;
        text-transform: none;
        user-select: text;
        -webkit-user-select: text;
      }
      #details {
        display: none;
        width: 100%;
        max-width: 360px;
        max-height: 45%;
        margin: 0;
        padding: 10px 12px;
        overflow: auto;
        border-radius: 10px;
        background: #00000059;
        color: #f2d9b0;
        font:
          500 11px/1.5 ui-monospace,
          Menlo,
          monospace;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-word;
        user-select: text;
        -webkit-user-select: text;
      }
      [data-state='error'] #details {
        display: block;
      }

      #stats {
        position: fixed;
        top: 8px;
        left: 10px;
        right: 10px;
        margin: 0;
        font:
          600 11px/1.4 ui-monospace,
          Menlo,
          monospace;
        text-shadow: 0 1px 3px #000;
        pointer-events: none;
      }

      /* The only control, a glass button: hold to walk forward; a drag anywhere else looks around.
         While held it squeezes, fills with light and sends out rings (transform and opacity only). */
      #walk {
        position: fixed;
        left: 18px;
        bottom: 20px;
        display: none;
        place-items: center;
        width: 80px;
        height: 80px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        color: #fff8ea;
        background:
          radial-gradient(
            circle at 32% 26%,
            #ffffffd9 0 5%,
            #ffffff40 11%,
            transparent 24%
          ),
          radial-gradient(circle at 50% 115%, #ffc24a59, transparent 55%),
          radial-gradient(circle, #3d1d064d 52%, #ffc24a40 74%, #ffe9bfa6 100%);
        box-shadow:
          0 0 0 1px #ffe9bf66,
          0 10px 28px #1c0a0073;
        touch-action: none;
        transition: transform 0.2s cubic-bezier(0.3, 1.6, 0.5, 1);
      }
      [data-state='ready'] #walk {
        display: grid;
      }
      #walk svg {
        position: relative;
        width: 30px;
        height: 30px;
        transition: transform 0.2s;
      }
      #walk::before,
      #walk::after,
      #walk .glow {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        pointer-events: none;
      }
      #walk .glow {
        background: radial-gradient(
          circle,
          #ffd98acc,
          #e0701f80 60%,
          transparent 72%
        );
        opacity: 0;
        transition: opacity 0.2s;
      }
      #walk::before,
      #walk::after {
        border: 2px solid #ffe6b3;
        opacity: 0;
      }
      #walk.on {
        transform: scale(0.9);
      }
      #walk.on svg {
        transform: translateY(-3px);
      }
      #walk.on .glow {
        opacity: 1;
      }
      #walk.on::before,
      #walk.on::after {
        animation: ripple 1.1s ease-out infinite;
      }
      #walk.on::after {
        animation-delay: 0.55s;
      }
      @keyframes ripple {
        from {
          transform: scale(1);
          opacity: 0.7;
        }
        to {
          transform: scale(1.75);
          opacity: 0;
        }
      }

      #hint {
        position: fixed;
        left: 112px;
        bottom: 38px;
        display: none;
        margin: 0;
        text-shadow: 0 1px 8px #000c;
        pointer-events: none;
        transition: opacity 0.6s;
      }
      #hint b {
        display: block;
        font-size: 16px;
      }
      #hint span {
        font-size: 12px;
        font-weight: 600;
        opacity: 0.8;
      }
      [data-state='ready'] #hint {
        display: block;
      }
      .walked #hint {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="loader">
      <h1>Forest</h1>
      <div id="track"><i id="bar"></i></div>
      <p id="status">Lacing boots…</p>
      <pre id="details"></pre>
    </div>
    <p id="stats" hidden></p>
    <button id="walk" aria-label="Walk">
      <i class="glow"></i>
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M12 3.2c.5 0 .9.2 1.2.6l6.6 9.4c.6.9 0 2.1-1.1 2.1h-3.4v4.4c0 .9-.7 1.6-1.6 1.6h-3.4c-.9 0-1.6-.7-1.6-1.6v-4.4H5.3c-1.1 0-1.7-1.2-1.1-2.1l6.6-9.4c.3-.4.7-.6 1.2-.6z"
        />
      </svg>
    </button>
    <p id="hint">
      <b>Hold to walk</b><span>Drag anywhere to look around</span>
    </p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
